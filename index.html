<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Каталог</title>
<style>
  :root{
    --bg: #14171C;
    --surface: #1B1F27;
    --card: #232833;
    --card-hi: #2B313E;
    --line: #323847;
    --text: #F2F3F5;
    --muted: #8A93A6;
    --accent: #F5A623;
    --accent-ink: #1A1305;
    --good: #34C77B;
    --danger: #E5484D;
    --radius: 16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
    padding-bottom:96px;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
    padding:18px 18px 8px;
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  header p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:13px;
  }

  .view{padding:0 14px;}
  .hidden{display:none !important;}

  /* ---------- catalog ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:8px;
  }
  .product{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:transform .15s ease, background .15s ease;
  }
  .product.added{
    background:var(--card-hi);
    transform:scale(0.98);
  }
  .product .thumb{
    height:64px;width:64px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
    background:radial-gradient(circle at 30% 30%, var(--card-hi), var(--card));
    border:1px solid var(--line);
    overflow:hidden;
  }
  .product .thumb img, .cart-item .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .product .name{font-size:14px;font-weight:600;line-height:1.25;}
  .product .desc{font-size:12px;color:var(--muted);line-height:1.3;min-height:30px;}
  .product .row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:auto;
  }
  .price{font-weight:700;font-size:14px;letter-spacing:-0.01em;}

  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{
    width:28px;height:28px;border-radius:8px;border:none;
    background:var(--line);color:var(--text);font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .stepper button.add{background:var(--accent);color:var(--accent-ink);font-weight:700;}
  .stepper .qty{min-width:16px;text-align:center;font-weight:700;font-size:13px;}

  /* ---------- cart / checkout shared ---------- */
  .section-title{
    font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
    margin:18px 0 8px;
  }
  .cart-item{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;margin-bottom:8px;
  }
  .cart-item .thumb{
    height:36px;width:36px;border-radius:9px;font-size:18px;
    display:flex;align-items:center;justify-content:center;background:var(--card-hi);
    overflow:hidden;
  }
  .cart-item .info{flex:1;min-width:0;}
  .cart-item .info .n{font-size:13px;font-weight:600;}
  .cart-item .info .p{font-size:12px;color:var(--muted);}

  .empty{
    text-align:center;color:var(--muted);font-size:13px;
    padding:40px 20px;
  }

  .field{margin-bottom:12px;}
  .field label{
    display:block;font-size:12px;color:var(--muted);
    margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;
  }
  .field input, .field textarea{
    width:100%;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:11px 12px;color:var(--text);
    font-size:14px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:56px;}

  .pay-options{display:flex;flex-direction:column;gap:8px;}
  .pay-opt{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;cursor:pointer;
  }
  .pay-opt.selected{border-color:var(--accent);background:var(--card-hi);}
  .pay-opt .dot{
    width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
    position:relative;
  }
  .pay-opt.selected .dot{border-color:var(--accent);}
  .pay-opt.selected .dot::after{
    content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent);
  }

  /* receipt-style summary */
  .receipt{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-top:16px;
  }
  .receipt .line{
    display:flex;justify-content:space-between;font-size:13px;
    padding:5px 0;color:var(--muted);
  }
  .receipt .line b{color:var(--text);font-weight:600;}
  .receipt .divider{
    border:none;border-top:1px dashed var(--line);margin:8px 0;
  }
  .receipt .total{
    display:flex;justify-content:space-between;font-size:16px;font-weight:700;
    padding-top:4px;
  }
  .receipt .total b{color:var(--accent);}

  /* ---------- bottom bar ---------- */
  .bottombar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, var(--bg) 25%);
  }
  .bar-inner{
    background:var(--accent);color:var(--accent-ink);
    border-radius:14px;padding:13px 16px;
    display:flex;align-items:center;justify-content:space-between;
    font-weight:700;font-size:14px;
    box-shadow:0 8px 24px rgba(245,166,35,.25);
    cursor:pointer;
    transform:translateY(0);
    transition:transform .15s ease;
  }
  .bar-inner:active{transform:translateY(2px);}
  .bar-inner .count{
    background:rgba(26,19,5,.18);
    border-radius:8px;padding:2px 8px;margin-right:8px;font-size:12px;
  }

  .backrow{
    display:flex;align-items:center;gap:10px;padding:14px 4px 0;
  }
  .backrow button{
    background:none;border:none;color:var(--text);font-size:15px;font-weight:600;
    display:flex;align-items:center;gap:4px;cursor:pointer;padding:4px 0;
  }

  .qty-x{
    display:flex;align-items:center;gap:6px;
  }
  .qty-x button{
    width:24px;height:24px;border-radius:7px;border:none;background:var(--line);
    color:var(--text);cursor:pointer;font-size:14px;
  }

  .done-screen{
    text-align:center;padding:60px 20px;
  }
  .done-screen .check{
    width:64px;height:64px;border-radius:50%;background:var(--good);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    font-size:30px;
  }
  .done-screen h2{margin:0 0 8px;font-size:19px;}
  .done-screen p{color:var(--muted);font-size:13px;margin:0;}
</style>
</head>
<body>

  <!-- ===== CATALOG ===== -->
  <div id="view-catalog" class="view">
    <header>
      <h1>🛍 Каталог</h1>
      <p>Выберите товар и оформите заказ прямо здесь</p>
    </header>
    <div id="grid" class="grid"></div>
  </div>

  <!-- ===== CART ===== -->
  <div id="view-cart" class="view hidden">
    <div class="backrow">
      <button onclick="showView('catalog')">← Каталог</button>
    </div>
    <header style="padding-left:4px;padding-right:4px;">
      <h1>Корзина</h1>
    </header>
    <div id="cart-list"></div>
    <div id="cart-receipt"></div>
  </div>

  <!-- ===== CHECKOUT ===== -->
  <div id="view-checkout" class="view hidden">
    <div class="backrow">
      <button onclick="showView('cart')">← Корзина</button>
    </div>
    <header style="padding-left:4px;padding-right:4px;">
      <h1>Оформление</h1>
    </header>

    <div class="section-title">Доставка</div>
    <div class="field">
      <label>Адрес</label>
      <input id="f-address" type="text" placeholder="Город, улица, дом, квартира">
    </div>
    <div class="field">
      <label>Телефон</label>
      <input id="f-phone" type="tel" placeholder="+7 ...">
    </div>
    <div class="field">
      <label>Комментарий (необязательно)</label>
      <textarea id="f-comment" placeholder="Пожелания к заказу"></textarea>
    </div>

    <div class="section-title">Оплата</div>
    <div class="pay-options" id="pay-options"></div>

    <div id="checkout-receipt"></div>
  </div>

  <!-- ===== DONE ===== -->
  <div id="view-done" class="view hidden">
    <div class="done-screen">
      <div class="check">✓</div>
      <h2>Заказ отправлен</h2>
      <p>Мы получили ваш заказ и скоро свяжемся с вами</p>
    </div>
  </div>

  <div class="bottombar" id="bottombar">
    <div class="bar-inner" id="bar-inner" onclick="onBarClick()">
      <span><span class="count" id="bar-count">0</span>Корзина</span>
      <span id="bar-total">0 ₽</span>
    </div>
  </div>

<script>
  // ---------------------------------------------------------------
  // Каталог загружается из products.json (лежит рядом с index.html).
  // Этот же файл читает бот на сервере, чтобы проверять цены —
  // редактируйте только products.json, не массив в коде.
  // ---------------------------------------------------------------
  let PRODUCTS = [];

  const PAY_METHODS = [
    { id: "cash", label: "Наличными при получении" },
    { id: "transfer", label: "Перевод на карту" },
  ];

  // ---------------------------------------------------------------

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  const cart = {}; // id -> qty
  let selectedPay = PAY_METHODS[0].id;

  async function loadProducts(){
    try {
      const res = await fetch("products.json", { cache: "no-store" });
      PRODUCTS = await res.json();
    } catch (e) {
      // локальный предпросмотр без сервера — заглушка
      PRODUCTS = [
        { id: "p1", emoji: "📦", name: "Товар 1", desc: "Краткое описание товара", price: 500 },
      ];
    }
    renderGrid();
    updateBar();
  }

  function fmt(n){ return n.toLocaleString("ru-RU") + " ₽"; }

  function thumbHtml(p){
    if (p.image){
      return `<img src="${p.image}" alt="" loading="lazy" onerror="this.parentElement.textContent='${p.emoji||'📦'}'">`;
    }
    return p.emoji || "📦";
  }

  function cartCount(){
    return Object.values(cart).reduce((a,b)=>a+b,0);
  }
  function cartTotal(){
    return Object.entries(cart).reduce((sum,[id,qty])=>{
      const p = PRODUCTS.find(p=>p.id===id);
      return sum + (p ? p.price*qty : 0);
    },0);
  }

  function renderGrid(){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    PRODUCTS.forEach(p=>{
      const qty = cart[p.id] || 0;
      const el = document.createElement("div");
      el.className = "product";
      el.id = "prod-"+p.id;
      el.innerHTML = `
        <div class="thumb">${thumbHtml(p)}</div>
        <div class="name">${p.name}</div>
        <div class="desc">${p.desc}</div>
        <div class="row">
          <div class="price">${fmt(p.price)}</div>
          <div class="stepper" id="stepper-${p.id}"></div>
        </div>
      `;
      grid.appendChild(el);
      renderStepper(p.id);
    });
  }

  function renderStepper(id){
    const holder = document.getElementById("stepper-"+id);
    const qty = cart[id] || 0;
    if (qty === 0){
      holder.innerHTML = `<button class="add" onclick="changeQty('${id}',1)">+</button>`;
    } else {
      holder.innerHTML = `
        <button onclick="changeQty('${id}',-1)">−</button>
        <span class="qty">${qty}</span>
        <button class="add" onclick="changeQty('${id}',1)">+</button>
      `;
    }
  }

  function changeQty(id, delta){
    const next = (cart[id]||0) + delta;
    if (next <= 0){ delete cart[id]; } else { cart[id] = next; }
    renderStepper(id);
    const card = document.getElementById("prod-"+id);
    card.classList.add("added");
    setTimeout(()=>card.classList.remove("added"), 150);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    updateBar();
  }

  function updateBar(){
    const count = cartCount();
    document.getElementById("bar-count").textContent = count;
    document.getElementById("bar-total").textContent = fmt(cartTotal());
    const bar = document.getElementById("bottombar");
    const onCatalogOrCart = document.getElementById("view-catalog").classList.contains("hidden") === false
      || document.getElementById("view-cart").classList.contains("hidden") === false;
    bar.classList.toggle("hidden", !(count > 0 && onCatalogOrCart));
  }

  function onBarClick(){
    showView("cart");
  }

  function showView(name){
    ["catalog","cart","checkout","done"].forEach(v=>{
      document.getElementById("view-"+v).classList.toggle("hidden", v!==name);
    });
    if (name==="cart") renderCart();
    if (name==="checkout") renderCheckout();
    updateBar();
    setupMainButton(name);
  }

  function renderCart(){
    const list = document.getElementById("cart-list");
    const entries = Object.entries(cart);
    if (entries.length === 0){
      list.innerHTML = `<div class="empty">Корзина пуста —<br>выберите что-нибудь из каталога</div>`;
      document.getElementById("cart-receipt").innerHTML = "";
      return;
    }
    list.innerHTML = entries.map(([id,qty])=>{
      const p = PRODUCTS.find(p=>p.id===id);
      return `
        <div class="cart-item">
          <div class="thumb">${thumbHtml(p)}</div>
          <div class="info">
            <div class="n">${p.name}</div>
            <div class="p">${fmt(p.price)} × ${qty}</div>
          </div>
          <div class="qty-x">
            <button onclick="changeQty('${id}',-1); renderCart();">−</button>
            <span class="qty">${qty}</span>
            <button onclick="changeQty('${id}',1); renderCart();">+</button>
          </div>
        </div>
      `;
    }).join("");

    document.getElementById("cart-receipt").innerHTML = `
      <div class="receipt">
        <div class="line"><span>Товаров</span><b>${cartCount()}</b></div>
        <hr class="divider">
        <div class="total"><span>Итого</span><b>${fmt(cartTotal())}</b></div>
      </div>
    `;
  }

  function renderCheckout(){
    const holder = document.getElementById("pay-options");
    holder.innerHTML = PAY_METHODS.map(m=>`
      <div class="pay-opt ${m.id===selectedPay?'selected':''}" onclick="selectPay('${m.id}')">
        <div class="dot"></div>
        <div>${m.label}</div>
      </div>
    `).join("");

    document.getElementById("checkout-receipt").innerHTML = `
      <div class="receipt">
        ${Object.entries(cart).map(([id,qty])=>{
          const p = PRODUCTS.find(p=>p.id===id);
          return `<div class="line"><span>${p.name} × ${qty}</span><b>${fmt(p.price*qty)}</b></div>`;
        }).join("")}
        <hr class="divider">
        <div class="total"><span>Итого</span><b>${fmt(cartTotal())}</b></div>
      </div>
    `;
  }

  function selectPay(id){
    selectedPay = id;
    renderCheckout();
  }

  function setupMainButton(view){
    if (!tg) return;
    if (view === "cart" && cartCount() > 0){
      tg.MainButton.setText("Оформить заказ");
      tg.MainButton.show();
      tg.MainButton.offClick(onMainButton);
      tg.MainButton.onClick(onMainButton);
    } else if (view === "checkout"){
      tg.MainButton.setText("Отправить заказ · " + fmt(cartTotal()));
      tg.MainButton.show();
      tg.MainButton.offClick(onMainButton);
      tg.MainButton.onClick(onMainButton);
    } else {
      tg.MainButton.hide();
    }
  }

  function onMainButton(){
    const view = document.getElementById("view-cart").classList.contains("hidden") ? "checkout" : "cart";
    if (view === "cart"){
      showView("checkout");
      return;
    }
    submitOrder();
  }

  function submitOrder(){
    const address = document.getElementById("f-address").value.trim();
    const phone = document.getElementById("f-phone").value.trim();

    if (!address){
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      document.getElementById("f-address").focus();
      return;
    }

    const items = Object.entries(cart).map(([id,qty])=>{
      const p = PRODUCTS.find(p=>p.id===id);
      return { id, name: p.name, price: p.price, qty };
    });

    const order = {
      type: "order",
      items,
      total: cartTotal(),
      address,
      phone,
      comment: document.getElementById("f-comment").value.trim(),
      payment: PAY_METHODS.find(m=>m.id===selectedPay).label,
    };

    if (tg){
      tg.MainButton.hide();
      tg.sendData(JSON.stringify(order));
      // Telegram закроет Mini App автоматически после sendData
    } else {
      // предпросмотр вне Telegram
      showView("done");
    }
  }

  loadProducts();
</script>
</body>
</html>
